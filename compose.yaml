
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: vehiculos
      MYSQL_USER: vehiculos_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vehiculos_net

  ms-vehiculos:
    build:
      context: ./ms-vehiculos
      dockerfile: Dockerfile
    image: ms-vehiculos:1.0
    restart: unless-stopped
    ports:
      - "9004:9004"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vehiculos
      DB_USERNAME: vehiculos_user
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 9004
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vehiculos_net

volumes:
  mysql_data:

networks:
  vehiculos_net:
    driver: bridge
