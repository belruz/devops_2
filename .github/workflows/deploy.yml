
name: CI/CD - MS Vehiculos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilacion y pruebas unitarias
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Ejecutar pruebas unitarias
        run: mvn -B clean verify

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            ms-vehiculos/target/surefire-reports/
            ms-vehiculos/target/site/jacoco/
          if-no-files-found: warn

  seguridad:
    name: Analisis de dependencias con Snyk
    runs-on: ubuntu-latest
    needs: pruebas

    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Preparar dependencias Maven
        run: mvn -B -DskipTests install

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Escanear dependencias y bloquear vulnerabilidades
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "ERROR: Falta configurar SNYK_TOKEN"
            exit 1
          fi
          snyk test --file=pom.xml --severity-threshold=high

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: [pruebas, seguridad]

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./ms-vehiculos
          file: ./ms-vehiculos/Dockerfile
          push: false
          tags: ms-vehiculos:${{ github.sha }}
