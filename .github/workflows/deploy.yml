
name: pipeline Vehiculos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: PRUEBAS UNITARIAS Y COBERTURA

  pruebas:
    name: Compilacion y pruebas unitarias
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Ejecutar pruebas unitarias y JaCoCo
        run: mvn -B clean verify

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            ms-vehiculos/target/surefire-reports/
            ms-vehiculos/target/site/jacoco/
          if-no-files-found: warn

  # JOB 2: ANALISIS CON SONARQUBE CLOUD

  sonar:
    name: Analisis de calidad y seguridad SonarQube
    runs-on: ubuntu-latest
    needs: pruebas

    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Descargar codigo e historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Cache de SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Verificar token SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: Falta configurar SONAR_TOKEN"
            exit 1
          fi

      - name: Ejecutar analisis de codigo y Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=belruz_devops_2 \
            -Dsonar.organization=belruz \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  # JOB 3: CONSTRUCCION DE IMAGEN DOCKER

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: [pruebas, sonar]

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./ms-vehiculos
          file: ./ms-vehiculos/Dockerfile
          push: false
          tags: ms-vehiculos:${{ github.sha }}
