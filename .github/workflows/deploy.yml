
name: CI/CD - MS Vehiculos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilacion y pruebas unitarias
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Ejecutar pruebas unitarias
        run: mvn -B clean verify

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            ms-vehiculos/target/surefire-reports/
            ms-vehiculos/target/site/jacoco/
          if-no-files-found: warn

  
  seguridad:
    name: Analisis de dependencias con Snyk
    runs-on: ubuntu-latest
    needs: pruebas

    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Verificar herramientas
        run: |
          java -version
          mvn -version
          snyk --version

      - name: Resolver dependencias Maven
        run: mvn -B install -DskipTests

      - name: Verificar autenticacion Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "ERROR: SNYK_TOKEN no configurado"
            exit 1
          fi
          snyk whoami

      - name: Escanear dependencias con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          
      - name: Escanear dependencias con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --org=belruz \
            --file=pom.xml \
            --severity-threshold=high \
            --json-file-output=snyk-report.json


      - name: Guardar reporte de Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: ms-vehiculos/snyk-report.json
          if-no-files-found: warn


  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: [pruebas, seguridad]

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./ms-vehiculos
          file: ./ms-vehiculos/Dockerfile
          push: false
          tags: ms-vehiculos:${{ github.sha }}
